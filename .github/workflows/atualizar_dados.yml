name: Atualizar Dados do Dashboard

on:
  schedule:
    - cron: '11 8 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Instalar bibliotecas necessárias
        run: |
          pip install pandas openpyxl shareplum requests

      - name: Executar script de atualização
        run: python atualizar_dados.py
        env:
          SHAREPOINT_USER: ${{ secrets.SHAREPOINT_USER }}
          SHAREPOINT_PASSWORD: ${{ secrets.SHAREPOINT_PASSWORD }}
          SHAREPOINT_SITE: ${{ secrets.SHAREPOINT_SITE }}
          SHAREPOINT_LIST: ${{ secrets.SHAREPOINT_LIST }}

      - name: Salvar as alterações no GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add dados/dashboard.xlsx
          git commit -m "🔄 Atualização automática dos dados [skip ci]" || echo "Sem alterações para commitar"
          git push
